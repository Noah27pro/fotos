<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis fotos y vídeos</title>
<style>
:root{
  --bg:#f4f5f2; --card:#ffffff; --text:#1d2420; --muted:#667068; --accent:#2f7d5b; --accent-text:#ffffff; --border:#dde1da; --danger:#c8402f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141815; --card:#1e2420; --text:#e8ece7; --muted:#9aa59d; --accent:#5ec394; --accent-text:#0f1a14; --border:#2d352f; --danger:#ef7a68;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141815; --card:#1e2420; --text:#e8ece7; --muted:#9aa59d; --accent:#5ec394; --accent-text:#0f1a14; --border:#2d352f; --danger:#ef7a68;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
main{max-width:960px;margin:0 auto;padding:32px 20px 48px}
h1{font-size:2rem;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
.sub,.bar,.empty,.note,.drop,#status{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.sub{margin:0 0 24px;color:var(--muted);font-size:.95rem}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 16px;border:2px dashed var(--border);border-radius:14px;background:var(--card);cursor:pointer;text-align:center;transition:border-color .15s}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--accent)}
.drop strong{font-size:1.05rem}
.drop span{color:var(--muted);font-size:.9rem}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px;font-size:.9rem;color:var(--muted)}
#status{min-height:1.4em;margin:0 0 10px;font-size:.9rem;color:var(--danger)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--card);border:1px solid var(--border)}
.item img,.item video{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.badge{position:absolute;left:8px;bottom:8px;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;font:600 .75rem system-ui,sans-serif;pointer-events:none}
.acts{position:absolute;top:6px;right:6px;display:flex;gap:6px}
.acts button,.close{width:32px;height:32px;border:0;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;font-size:18px;line-height:1;cursor:pointer}
.acts button:hover,.acts button:focus-visible{background:var(--accent);color:var(--accent-text)}
.acts .del:hover,.acts .del:focus-visible{background:var(--danger);color:#fff}
.dlbtn{display:none}
.can-dl .acts .dlbtn{display:block}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.note{margin-top:28px;color:var(--muted);font-size:.85rem}
.view{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:56px 20px 24px;z-index:10}
.view.on{display:flex}
#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#stage img,#stage video{max-width:100%;max-height:100%;border-radius:6px}
.close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px}
.big{padding:10px 20px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-text);font:600 .95rem system-ui,sans-serif;cursor:pointer}
.can-dl .big{display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Mis fotos y vídeos</h1>
  <p class="sub">Sube tus fotos y vídeos, guárdalos en un solo lugar y descárgalos cuando quieras.</p>

  <label class="drop" id="drop">
    <strong>Elegir fotos o vídeos</strong>
    <span>o arrástralos hasta aquí</span>
    <input type="file" id="file" accept="image/*,video/*" multiple>
  </label>

  <div class="bar"><span id="count">0 archivos</span></div>
  <p id="status" role="status"></p>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty">Todavía no hay archivos. Sube el primero.</p>
  <p class="note" id="note"></p>
</main>

<div class="view" id="view">
  <button class="close" id="close" type="button" aria-label="Cerrar">×</button>
  <div id="stage"></div>
  <button class="big dlbtn" id="vdl" type="button">Descargar</button>
</div>

<script>
var DB_NAME = "mis-fotos", STORE = "fotos", db = null, mem = [], urls = [], dl = null, current = null;
var grid = document.getElementById("grid"), empty = document.getElementById("empty");
var count = document.getElementById("count"), note = document.getElementById("note"), status = document.getElementById("status");
var view = document.getElementById("view"), stage = document.getElementById("stage");
var ALLOWED = ["gif","png","jpg","jpeg","webp","mp4","webm","mov"];
var MIME = {"image/jpeg":"jpg","image/png":"png","image/gif":"gif","image/webp":"webp","video/mp4":"mp4","video/webm":"webm","video/quicktime":"mov"};

function openDB(){
  return new Promise(function(res, rej){
    try{
      var r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore(STORE, {keyPath:"id", autoIncrement:true}); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    }catch(e){ rej(e); }
  });
}
function store(mode){ return db.transaction(STORE, mode).objectStore(STORE); }
function wrap(r){ return new Promise(function(res, rej){ r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; }); }
async function getAll(){ return db ? wrap(store("readonly").getAll()) : mem.slice(); }
async function addItem(rec){
  if(db){ await wrap(store("readwrite").add(rec)); }
  else { rec.id = Date.now() + Math.random(); mem.push(rec); }
}
async function removeItem(id){
  if(db){ await wrap(store("readwrite").delete(id)); }
  else { mem = mem.filter(function(m){ return m.id !== id; }); }
}

function isVideo(p){ return p.blob.type.indexOf("video/") === 0; }
function fileName(p){
  var m = /\.([a-z0-9]+)$/i.exec(p.name), ext = m ? m[1].toLowerCase() : "";
  if(ALLOWED.indexOf(ext) < 0 && MIME[p.blob.type]) return p.name.replace(/\.[^.]*$/, "") + "." + MIME[p.blob.type];
  return p.name;
}
async function download(p){
  status.textContent = "";
  if(!dl) return;
  try{ await dl.save({filename:fileName(p), data:p.blob}); }
  catch(e){
    var c = e && e.code;
    if(c === "declined") return;
    status.textContent = (c === "rejected_extension" || c === "not_signed")
      ? "Este formato no se puede descargar desde aquí: " + p.name
      : "No se pudo descargar " + p.name + ". Inténtalo de nuevo.";
  }
}

function openView(p, url){
  current = p; stage.innerHTML = "";
  var el = document.createElement(isVideo(p) ? "video" : "img");
  el.src = url;
  if(isVideo(p)){ el.controls = true; el.autoplay = true; el.playsInline = true; } else { el.alt = p.name; }
  stage.appendChild(el); view.classList.add("on");
}
function closeView(){ view.classList.remove("on"); stage.innerHTML = ""; current = null; }

async function render(){
  urls.forEach(function(u){ URL.revokeObjectURL(u); });
  urls = [];
  var list = (await getAll()).sort(function(a, b){ return b.date - a.date; });
  grid.innerHTML = "";
  list.forEach(function(p){
    var url = URL.createObjectURL(p.blob); urls.push(url);
    var box = document.createElement("div"); box.className = "item";
    var media;
    if(isVideo(p)){
      media = document.createElement("video"); media.src = url + "#t=0.1"; media.muted = true; media.preload = "metadata"; media.playsInline = true;
      var b = document.createElement("span"); b.className = "badge"; b.textContent = "Vídeo";
      box.appendChild(media); box.appendChild(b);
    } else {
      media = document.createElement("img"); media.src = url; media.alt = p.name; media.loading = "lazy";
      box.appendChild(media);
    }
    media.onclick = function(){ openView(p, url); };
    var acts = document.createElement("div"); acts.className = "acts";
    var d = document.createElement("button"); d.type = "button"; d.className = "dlbtn"; d.textContent = "↓";
    d.setAttribute("aria-label", "Descargar " + p.name); d.onclick = function(){ download(p); };
    var x = document.createElement("button"); x.type = "button"; x.className = "del"; x.textContent = "×";
    x.setAttribute("aria-label", "Eliminar " + p.name);
    x.onclick = async function(){ await removeItem(p.id); render(); };
    acts.appendChild(d); acts.appendChild(x); box.appendChild(acts); grid.appendChild(box);
  });
  count.textContent = list.length + (list.length === 1 ? " archivo" : " archivos");
  empty.style.display = list.length ? "none" : "block";
}

async function addFiles(files){
  status.textContent = "";
  for(var i = 0; i < files.length; i++){
    var f = files[i];
    if(f.type.indexOf("image/") !== 0 && f.type.indexOf("video/") !== 0) continue;
    try{ await addItem({name:f.name, blob:f, date:Date.now() + i}); }
    catch(e){ status.textContent = "No se pudo guardar " + f.name + ". Prueba con un archivo más pequeño."; }
  }
  render();
}

var drop = document.getElementById("drop"), input = document.getElementById("file");
input.onchange = function(){ addFiles(input.files); input.value = ""; };
["dragenter","dragover"].forEach(function(t){ drop.addEventListener(t, function(e){ e.preventDefault(); drop.classList.add("over"); }); });
["dragleave","drop"].forEach(function(t){ drop.addEventListener(t, function(e){ e.preventDefault(); drop.classList.remove("over"); }); });
drop.addEventListener("drop", function(e){ addFiles(e.dataTransfer.files); });
document.getElementById("close").onclick = closeView;
view.onclick = function(e){ if(e.target === view || e.target === stage) closeView(); };
document.getElementById("vdl").onclick = function(){ if(current) download(current); };
document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeView(); });

(async function(){
  try{
    db = await openDB();
    note.textContent = "Los archivos se guardan en este navegador y solo tú los ves.";
  }catch(e){
    db = null;
    note.textContent = "Este navegador no permite guardar de forma permanente: los archivos se perderán al cerrar la página.";
  }
  render();
  try{
    if(window.claude && window.claude.use){
      dl = await window.claude.use("downloads");
      if(dl) document.body.classList.add("can-dl");
    }
  }catch(e){ dl = null; }
})();
</script>
</body>
</html>
